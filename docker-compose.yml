services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sms_db
      DB_USERNAME: sms_user
      DB_PASSWORD: sms_secure_password
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - app_uploads:/var/www/html/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: sms_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_master_password
      MYSQL_DATABASE: sms_db
      MYSQL_USER: sms_user
      MYSQL_PASSWORD: sms_secure_password
    volumes:
      - db_data:/var/lib/mysql
      - ./database/sms_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_master_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  app_uploads:
