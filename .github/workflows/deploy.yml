name: SMS CI/CD Pipeline & Hostinger Deploy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-and-test:
    name: Security Audits & Unit Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sms_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql, gd
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Security Vulnerability Audit
        run: composer audit

      - name: Setup Node.js & Build Assets
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Audit NPM Packages
        run: |
          npm ci
          npm run build

      - name: Execute Laravel Test Suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sms_db
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/phpunit

  deploy:
    name: Deploy to Hostinger via SFTP
    needs: security-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Files to Hostinger Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USER }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: 22
          protocol: sftp
          local-dir: ./
          server-dir: /public_html/sms/

